{% extends 'layout.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white p-8 rounded-2xl shadow-xl animate__animated animate__fadeInUp">
        <h2 class="text-3xl font-bold mb-2">Analisis Sentimen</h2>
        <p class="text-gray-500 mb-6">Masukkan komentar untuk dibandingkan oleh model KNN dan Decision Tree.</p>

        <form hx-post="/predict" hx-target="#result" hx-indicator="#loading">
            <textarea name="komentar" rows="4" 
                class="w-full p-4 border-2 border-gray-100 rounded-xl focus:border-blue-500 focus:outline-none transition"
                placeholder="Contoh: Pelayanannya buruk sekali dan kurang ramah..."></textarea>
            
            <button type="submit" 
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2">
                🚀 Analisis Sekarang
            </button>
        </form>

        <div id="loading" class="htmx-indicator mt-6">
            <div class="flex flex-col items-center gap-2">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
                <p class="text-sm text-gray-500">Sastrawi sedang melakukan stemming...</p>
            </div>
        </div>

        <div id="result" class="mt-8"></div>
    </div>
</div>
{% endblock %}
