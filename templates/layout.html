<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimenAI - KNN vs Decision Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: block; }
        .htmx-request.htmx-indicator { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <span>📊</span> SentimenAI
            </h1>
            <div class="space-x-6 font-medium">
                <a href="/"
                class="{% if request.path == '/' %}
                        text-blue-600 border-b-2 border-blue-600
                        {% else %}
                        hover:text-blue-600
                        {% endif %}
                        transition pb-1">
                    Beranda
                </a>

                <a href="/analysis"
                class="{% if request.path.startswith('/analysis') %}
                        text-blue-600 border-b-2 border-blue-600
                        {% else %}
                        hover:text-blue-600
                        {% endif %}
                        transition pb-1">
                    Analisis
                </a>

                <a href="/performance"
                class="{% if request.path.startswith('/performance') %}
                        text-blue-600 border-b-2 border-blue-600
                        {% else %}
                        hover:text-blue-600
                        {% endif %}
                        transition pb-1">
                    Performa
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-10 px-4">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
